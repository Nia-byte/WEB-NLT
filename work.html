<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Work</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Inter:wght@900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
    <style>
        :root {
            --purple: #4634e8;
            --bg-overlay: rgba(10, 10, 10, 0.909);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

 /*WHAT WE DO SECTION*/
         /* Main scroll section container */
        .scroll-section {
            position: relative;
            height: 400vh;
            background: #000;
        }

        /* Pinned container that stays in viewport */
        .pinned-container {
            position: sticky;
            top: 0;
            height: 100vh;
            overflow: hidden;
        }

          
        /* Header that stays visible */
        .section-header {
            position: absolute;
            top: 80px;
            left: 80px;
            z-index: 10;
            font-size: 1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.7;
            font-weight: 300;
        }

        /* Horizontal sliding container */
        .horizontal-wrapper {
            display: flex;
            height: 100vh;
            align-items: center;
            will-change: transform;
        }

        /* Individual service blocks */
        .service-block {
            min-width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 80px;
            position: relative;
            margin-bottom: -90px;
        }

        /* Animated line above text */
        .line-do {
            position: absolute;
            top: 40%;
            left: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.3);
            transform-origin: left;
            transform: scaleX(0);
        }

        /* Main service title */
        .service-title {
            font-size: 90px;
            font-weight: 700;
            line-height: 0.9;
            margin-bottom: 30px;
            opacity: 0;
            transform: translateY(50px);
        }

        
        /* Service description */
        .service-description {
            font-size: 20px;
            font-weight: 300;
            opacity: 0;
            transform: translateY(30px);
            color: rgba(255, 255, 255, 0.7);
            max-width: 800px;
            font-family: 'Nunito';
        }

         /* Image container */
        .image-container {
            position: absolute;
            right: 100px;
            top: 40%;
            transform: translateY(-50%);
            width: 450px;
            height: 450px;
            opacity: 0;
        }

        /* Blue outlined box */
        .image-box {
            width: 100%;
            height: 100%;
            border: 3px solid #000;
            border-radius: 20px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px  #000;
        }

        .image-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            border-radius: 18px;
        }

        /* Service image */
        .service-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
            position: relative;
            z-index: 1;
        }

        /* Gradient text effect */
        .gradient-text {
            background: linear-gradient(135deg, #fff 0%, #888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }


 
 </style>
</head>
<body>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script> 

    <script>
         const horizontalWrapper = document.querySelector('.horizontal-wrapper');
        const serviceBlocks = document.querySelectorAll('.service-block');
        
        // Calculate total scroll distance
        const totalWidth = horizontalWrapper.scrollWidth - window.innerWidth;

        // Create the horizontal scroll effect
        gsap.to(horizontalWrapper, {
            x: -totalWidth,
            ease: "none",
            scrollTrigger: {
                trigger: ".scroll-section",
                start: "top top",
                end: "bottom bottom",
                scrub: 1,
                pin: ".pinned-container",
                anticipatePin: 1,
                invalidateOnRefresh: true
            }
        });

        // Animate each service block
        serviceBlocks.forEach((block, index) => {
            const line = block.querySelector('.line');
            const title = block.querySelector('.service-title');
            const description = block.querySelector('.service-description');
            const imageContainer = block.querySelector('.image-container');

            // Create timeline for this block
            const tl = gsap.timeline({
                scrollTrigger: {
                    trigger: block,
                    containerAnimation: gsap.getProperty(horizontalWrapper, 'x') ? 
                        gsap.to(horizontalWrapper, { x: -totalWidth }) : null,
                    start: "left 80%",
                    end: "left 20%",
                    scrub: 1,
                    toggleActions: "play none none reverse"
                }
            });

            // Animate line expansion
            tl.to(line, {
                scaleX: 1,
                duration: 1,
                ease: "power2.out"
            }, 0);

            // Staggered text reveal
            tl.to(title, {
                opacity: 1,
                y: 0,
                duration: 1,
                ease: "power3.out"
            }, 0.2);

            tl.to(description, {
                opacity: 1,
                y: 0,
                duration: 1,
                ease: "power3.out"
            }, 0.4);

            // Animate image container
            tl.to(imageContainer, {
                opacity: 1,
                scale: 1,
                duration: 1,
                ease: "power3.out"
            }, 0.5);
        });

        // Refresh ScrollTrigger on resize
        window.addEventListener('resize', () => {
            ScrollTrigger.refresh();
        });

       
    </script>
</body>
</html>
