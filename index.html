<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NiaLure-Tech</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Inter:wght@900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --purple: #4634e8;
            --bg-overlay: rgba(10, 10, 10, 0.909);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #000;
            font-family: 'Inter', sans-serif, 'Nunito';
            color: white;
            overflow: hidden;
        }

        .hero-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 1. Background Layer */
        .background {
            position: absolute;
            inset: 0;
            z-index: 1;
        }
        .background-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .background-overlay {
            position: absolute;
            inset: 0;
            background: var(--bg-overlay);
        }

        /* 2. Navigation */
        /* Ensure the nav uses space-between to keep logo left and links center/right */
nav {
    position: absolute;
    top: 0;
    width: 100%;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 30px 60px;
    opacity: 0; /* Keeps it hidden for the GSAP entrance */
}
        
        .logo-img {
            height: 220px !important;
            width: auto;
            display: block;
        }

        /* Container for logo and text */
.logo-wrapper {
    display: flex;
    align-items: center;
    gap: 15px; /* Space between logo and text */
}

.logo-img {
    height: 60px !important; /* Adjusted size to look better with text */
    width: auto;
    display: block;
}

.logo-text {
    font-family: 'Inter', sans-serif 'Nunito';
    font-weight: 700;
    font-size: 1.2rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: white;
}
        
        .nav-links { 
            display: flex; 
            gap: 40px; 
            margin-left: -90px;
        }
        
        .nav-links a { 
            color: white; 
            text-decoration: none; 
            font-size: 0.85rem; 
            font-weight: 400;
            font-family: 'Nunito';
            transition: color 0.3s;
        }
        
        .nav-links a:hover, .nav-links a.active {
            color: var(--purple);
        }
        
        .get-in-touch {
            background: var(--purple);
            padding: 10px 28px;
            border-radius: 30px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-family: 'Nunito';
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.80rem;
        }

        /* Main Content Typography */
        .main-content {
            position: relative;
            z-index: 10;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .text-block {
            line-height: 0.85;
            position: absolute;
            /* Initial state for GSAP */
            opacity: 0; 
        }

        .font-heavy { 
            font-size: 9rem; 
            font-weight: 900; 
            display: block;
            letter-spacing: -8px;
            text-transform: uppercase;
        }
        
        .font-serif { 
            font-family: 'Playfair Display', serif; 
            font-size: 8rem; 
            font-style: italic;
            display: block;
            letter-spacing: 5px;
            text-transform: capitalize;
        }

        .left-side {
            color: white;
            left: 10%;
            margin-bottom: 100px;
            text-align: left;
        }

        .right-side { 
            color: var(--purple);
            text-align: left;
            right: 15%;
            margin-top: 290px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .font-heavy { font-size: 5rem; }
            .font-serif { font-size: 5rem; }
            .left-side { left: 5%; }
            .right-side { right: 5%; }
        }

        @media (max-width: 768px) {
            .font-heavy { font-size: 3.5rem; letter-spacing: -2px;}
            .font-serif { font-size: 3rem; }
            .left-side, .right-side { 
                position: relative; 
                left: auto;
                right: auto;
                margin: 0;
                text-align: center;
            }
            .main-content { 
                flex-direction: column; 
                gap: 1rem; 
            }
        }

        /* The Bottom White Fade Layer */
.hero-container::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 100px; /* Increased slightly for a smoother transition */
    background: linear-gradient(to bottom, transparent, #02221f);
    z-index: 2; /* Sits on top of the image, but behind text */
}

/* Ensure your text and nav stay above the pseudo-elements */
.main-content, nav {
    z-index: 10;
}
    </style>
</head>
<body>

    <nav id="navbar">
        <div class="logo-wrapper">
           <img src="/images/logo.png" alt="NiaLure-Tech" class="logo-img">
           <span class="logo-text">Nialure Tech</span>
        </div>
        <div class="nav-links">
            <a href="#">Our Work</a>
            <a href="#" class="active">Company</a>
            <a href="#">Services</a>
        </div>
        <a href="#" class="get-in-touch">
            <span class="arrow">→</span>
            <span>Get in Touch</span>
        </a>
    </nav>

    <div class="hero-container">
        <div class="background">
            <img src="/images/hero.jpg" class="background-image">
            <div class="background-overlay"></div>
        </div>

        <div class="main-content">
            <div class="text-block left-side" id="leftText">
                <span class="font-heavy">Build With</span>
                <span class="font-serif">Purpose</span>
            </div>

            <div class="text-block right-side" id="rightText">
                <span class="font-heavy">And</span>
                <span class="font-serif">Allure</span>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        // Create a Timeline for the Hero Animation
        const tl = gsap.timeline({ defaults: { ease: "power4.out", duration: 1.5 }});

        // 1. Initial background zoom
        gsap.to(".background-image", {
            scale: 1.1,
            duration: 10,
            repeat: -1,
            yoyo: true,
            ease: "linear"
        });

        // 2. Animate Left Text (Slide from further left and fade in)
        tl.fromTo("#leftText", 
            { x: -200, opacity: 0 }, 
            { x: 0, opacity: 1 }, 
            0.5 // Start after 0.5s
        );

        // 3. Animate Right Text (Slide from further right and fade in)
        // Starts slightly after the left text for that "Rhythm" feel
        tl.fromTo("#rightText", 
            { x: 200, opacity: 0 }, 
            { x: 0, opacity: 1 }, 
            0.8 
        );

        // 4. Fade in Navbar
        tl.to("#navbar", { opacity: 1, duration: 1 }, "-=0.5");

    </script>
</body>
</html>
